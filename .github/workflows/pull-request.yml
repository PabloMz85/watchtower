name: Pull Request

on:
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.4
      - name: Static analysis
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - 1.27.4
        platform:
          - macos-latest
          - windows-latest
          - ubuntu-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.4
          cache: false
      # Adapted from #2131: keep race artifacts out of other jobs' cache keys.
      - name: Resolve Go race cache paths
        id: race-cache-paths
        shell: bash
        run: |
          gomodcache="$(go env GOMODCACHE)"
          gocache="$(go env GOCACHE)"
          # go.exe may write CRLF; GitHub outputs require single-line values.
          gomodcache="${gomodcache%$'\r'}"
          gocache="${gocache%$'\r'}"
          for cache_path in "$gomodcache" "$gocache"; do
            case "$cache_path" in
              ''|*$'\n'*|*$'\r'*) printf '%s\n' 'Invalid Go cache path' >&2; exit 1 ;;
            esac
            case "$cache_path" in
              /*|[[:alpha:]]:[\\/]*) ;;
              *) printf '%s\n' 'Go cache path must be absolute' >&2; exit 1 ;;
            esac
          done
          printf 'gomodcache=%s\ngocache=%s\n' "$gomodcache" "$gocache" >> "$GITHUB_OUTPUT"
      - name: Cache Go race modules and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.race-cache-paths.outputs.gomodcache }}
            ${{ steps.race-cache-paths.outputs.gocache }}
          key: race-test-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-go${{ matrix.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            race-test-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-go${{ matrix.go-version }}-
      - name: Run tests
        run: go test -race -coverprofile coverage.out -covermode atomic ./...
      - name: Check known vulnerabilities
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Verify real Docker update
        if: runner.os == 'Linux'
        run: WATCHTOWER_INTEGRATION=1 go test ./integration -v -count=1
      - name: Publish coverage on Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          fail_ci_if_error: true
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.4
      - name: Build
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de #v3
        with:
          version: v0.155.0
          args: --snapshot --skip-publish --debug
